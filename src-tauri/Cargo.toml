[package]
name = "squish"
version = "0.0.1"
description = "Compress and convert images locally."
authors = ["Behon Baker"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "squish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
rayon = "1.10"

# Image engine
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "rayon"] }
imagequant = "4.4"
oxipng = { version = "10", default-features = false, features = ["zopfli", "parallel"] }
png = "0.17"
mozjpeg = "0.10"
webp = "0.3"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
heic-rs = "0.1.4"
moxcms = "0.9.1"
img-parts = "0.4.0"

[dev-dependencies]
tempfile = "3"

# Image codecs are CPU heavy (rav1e especially). Keep dependencies optimised
# even in debug builds, otherwise AVIF encoding takes minutes per image.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.5.0"
