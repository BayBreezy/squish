<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.55" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4c0519" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4c0519" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- tile (macOS-style margin: 100px) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <!-- pressing plates -->
  <g filter="url(#soft)" fill="#fff">
    <rect x="262" y="228" width="500" height="68" rx="34"/>
    <rect x="262" y="728" width="500" height="68" rx="34"/>
  </g>
  <!-- squished pixel block: 2x2 cells -->
  <g filter="url(#soft)" fill="#fff">
    <rect x="352" y="372" width="156" height="132" rx="26"/>
    <rect x="524" y="372" width="156" height="132" rx="26" fill-opacity="0.62"/>
    <rect x="352" y="520" width="156" height="132" rx="26" fill-opacity="0.62"/>
    <rect x="524" y="520" width="156" height="132" rx="26"/>
  </g>
</svg>
