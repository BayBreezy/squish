name: Release

# Publish a build that anyone can download:
#   1. bump the version (package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml)
#   2. merge to main, then `git tag v1.2.3 && git push origin v1.2.3`
# This builds macOS (Apple Silicon + Intel), Windows and Linux installers and
# attaches them to a DRAFT GitHub release. Review it, then press "Publish".
#
# Run manually (Actions tab -> Release -> Run workflow) to get installers as
# build artifacts without creating a release, e.g. to test a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf nasm

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install nasm (Intel macOS target)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - run: bun install --frozen-lockfile

      # Tauri decides to sign by checking whether these variables EXIST, even if
      # empty. Unset secrets expand to empty strings, so exporting them
      # unconditionally makes an unsigned build fail ("failed to import keychain
      # certificate"). Export only the ones that really have a value.
      - name: Configure macOS signing (only when secrets are set)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "$name<<__EOF__"; echo "$value"; echo "__EOF__"; } >> "$GITHUB_ENV"
              echo "$name is set"
            else
              echo "$name is not set (building unsigned for this part)"
            fi
          done

      - name: Build and (for tags) upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Squish ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system from the assets below.

            - **macOS:** `.dmg` (choose Apple Silicon `aarch64` or Intel `x64`)
            - **Windows:** `.exe` (NSIS) or `.msi`
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            Unsigned builds may show a security warning the first time you open them.
            See the README for how to open them.
          releaseDraft: true
          prerelease: false
          # No auto-updater is configured, so there is no latest.json to publish.
          uploadUpdaterJson: false
          # Manual runs: keep the installers as downloadable build artifacts.
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: ${{ matrix.args }}
